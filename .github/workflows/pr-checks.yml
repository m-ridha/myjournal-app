name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes requiring checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B -m unittest discover -s scripts/python -p test_pr_checks.py
          python3 -B scripts/python/pr_checks.py

      - name: Set up Go
        if: steps.changes.outputs.run_code_checks == 'true' || steps.changes.outputs.run_build_checks == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js for browser interaction tests
        if: steps.changes.outputs.run_code_checks == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install golangci-lint
        if: steps.changes.outputs.run_code_checks == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-only: true

      - name: Install Mockery
        if: steps.changes.outputs.run_code_checks == 'true'
        run: go install github.com/vektra/mockery/v3@v3.8.1

      - name: Check generated mocks
        if: steps.changes.outputs.run_code_checks == 'true'
        run: |
          make generate-mocks
          git diff --exit-code -- ':(glob)**/mock_*_test.go'
          test -z "$(git ls-files --others --exclude-standard -- ':(glob)**/mock_*_test.go')"

      - name: Check formatting
        if: steps.changes.outputs.run_code_checks == 'true'
        run: |
          make fmt
          git diff --exit-code -- '*.go'

      - name: Lint
        if: steps.changes.outputs.run_code_checks == 'true'
        run: make lint

      - name: Run JavaScript and race-enabled Go tests
        if: steps.changes.outputs.run_code_checks == 'true'
        run: make test GOTEST="go test -race ./..."

      - name: Check reachable Go vulnerabilities
        if: steps.changes.outputs.run_code_checks == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Test release deployment handling
        if: steps.changes.outputs.run_code_checks == 'true'
        run: python3 -B -m unittest discover -s scripts/python -p test_deploy_railway.py

      # These probes temporarily add forbidden imports; do not run in parallel.
      - name: Verify architecture boundaries
        if: steps.changes.outputs.run_code_checks == 'true'
        run: make test-architecture

      - name: Validate workflows
        if: steps.changes.outputs.run_build_checks == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate configuration syntax
        if: steps.changes.outputs.run_build_checks == 'true'
        run: |
          ruby -ryaml -e 'YAML.load_file(".github/dependabot.yml") if File.exist?(".github/dependabot.yml")'
          test -z "$(gofmt -l .railway/railway.go)"
          (cd .railway && go mod verify && go vet ./...)

      - name: Build container
        if: steps.changes.outputs.run_build_checks == 'true'
        run: docker build --tag myjournal-pr-check .
