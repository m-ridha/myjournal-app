name: Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reuses the PR routing policy in scripts/python/pr_checks.py; its unit tests run in PR checks.
      - name: Detect browser-affecting changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/python/pr_checks.py

      - name: Set up Go
        if: steps.changes.outputs.run_e2e_checks == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        if: steps.changes.outputs.run_e2e_checks == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        if: steps.changes.outputs.run_e2e_checks == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changes.outputs.run_e2e_checks == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.changes.outputs.run_e2e_checks == 'true'
        run: make test-e2e

      - name: Upload report
        if: ${{ !cancelled() && steps.changes.outputs.run_e2e_checks == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
