name: Release to Railway

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo 'Expected release tag vX.Y.Z with an optional version suffix'; exit 1;
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release is from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-only: true
      - name: Validate release code
        run: |
          python3 -B -m unittest discover -s scripts/python -p test_deploy_railway.py
          test -z "$(gofmt -l .railway/railway.go)"
          (cd .railway && go mod verify && go vet ./...)
          make fmt lint test
          git diff --exit-code -- '*.go'
          make test-architecture
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Install pinned Railway CLI
        run: |
          npm install --global --allow-scripts=@railway/cli @railway/cli@5.70.0
          railway --version
      - name: Deploy release source and verify health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          source_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$source_dir"
          printf '%s\n' "$RELEASE_TAG" > "$source_dir/RELEASE_VERSION"
          python3 scripts/python/deploy-railway.py "$source_dir" "$(git rev-parse HEAD)"
