openapi: 3.2.1
info:
  title: myjournal API
  version: 0.1.0
  description: >-
    API contract for the 'myjournal' journaling app. Requests use the optional
    mj_tz cookie containing a URL-encoded browser IANA time zone. Missing,
    invalid, or host-dependent Local values fall back to UTC. Today and future
    date validation use this resolved zone; an explicit entry date stays fixed.
servers:
  - url: http://localhost:3030
    description: Local development server
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      operationId: healthz
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/entries:
    get:
      summary: List entries
      operationId: listEntries
      parameters:
        - $ref: '#/components/parameters/PaginationPageQueryParam'
        - $ref: '#/components/parameters/PaginationSizeQueryParam'
      responses:
        '400':
          description: Page or size is outside the supported range, or is not an integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/entries/{date}:
    parameters:
      - $ref: '#/components/parameters/DatePathParam'
    get:
      summary: Fetch a single entry
      operationId: getEntry
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Entry payload. Missing entries return 200 with exists false and empty text/version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      summary: Save or create an entry
      description: Requires a valid session. JSON envelope is limited to 1048576 bytes. Invalid UTF-8 and unpaired Unicode surrogate escapes are rejected without saving. Unsafe cross-origin browser requests are rejected.
      operationId: saveEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEntryRequest'
      responses:
        '400':
          description: Invalid JSON, missing/null/non-string required fields, invalid Unicode, or a future entry date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cross-origin browser request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: JSON envelope exceeds 1048576 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      summary: Move an entry to trash
      operationId: deleteEntry
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Entry deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/calendar:
    get:
      summary: Get a calendar view for a month
      operationId: getCalendar
      parameters:
        - $ref: '#/components/parameters/MonthQueryParam'
      responses:
        '200':
          description: Calendar month data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/auth/{provider}/login:
    get:
      summary: Start provider login flow
      security: []
      operationId: startProviderLogin
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
      responses:
        '302':
          description: Redirect to provider login
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/auth/{provider}/callback:
    get:
      summary: Complete provider login flow
      security: []
      operationId: completeProviderLogin
      parameters:
        - $ref: '#/components/parameters/ProviderPathParam'
        - $ref: '#/components/parameters/AuthCodeQueryParam'
        - $ref: '#/components/parameters/AuthStateQueryParam'
      responses:
        '302':
          description: Redirect to authenticated app page
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/logout:
    post:
      summary: Log the current user out
      security: []
      operationId: logout
      responses:
        '302':
          description: Redirect to landing page
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings:
    get:
      summary: Get connected account settings
      operationId: getSettings
      responses:
        '200':
          description: Settings payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mj_session
      description: Encrypted authenticated HttpOnly cookie, SameSite=Lax, fixed 30-day lifetime. Secure is required for HTTPS deployment; localhost development can disable it. Missing, expired, invalid, or revoked connections require sign-in (401).
  parameters:
    ProviderPathParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, local]
    DatePathParam:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date

    PaginationPageQueryParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PaginationSizeQueryParam:
      in: query
      name: size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MonthQueryParam:
      in: query
      name: month
      required: true
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: Required calendar month in YYYY-MM format, year 0001 through 9999.
    AuthCodeQueryParam:
      in: query
      name: code
      required: false
      schema:
        type: string
    AuthStateQueryParam:
      in: query
      name: state
      required: false
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Entry:
      type: object
      required: [date, text, version, exists]
      properties:
        date:
          type: string
          format: date
        text:
          type: string
        version:
          type: string
        exists:
          type: boolean

    SaveEntryRequest:
      type: object
      required: [text, baseVersion]
      description: Both fields must be explicit strings. Empty text is valid; omitted or null fields are rejected.
      properties:
        text:
          type: string
        baseVersion:
          type: string
          description: Empty string creates a missing entry; otherwise must match the current opaque version.

    ListEntriesResponse:
      type: object
      required: [items, page, pageSize, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        hasNext:
          type: boolean

    ListItem:
      type: object
      required: [date, preview]
      properties:
        date:
          type: string
          format: date
        preview:
          type: string

    CalendarResponse:
      type: object
      required: [year, month, weeks]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        weeks:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/CalendarDay'

    CalendarDay:
      type: object
      required: [date, inMonth, hasEntry, isToday, isFuture]
      properties:
        date:
          type: string
          format: date
        inMonth:
          type: boolean
        hasEntry:
          type: boolean
        isToday:
          type: boolean
        isFuture:
          type: boolean

    SettingsResponse:
      type: object
      required: [accountName, provider]
      properties:
        accountName:
          type: string
        provider:
          type: string
        folderUrl:
          type: string
          nullable: true

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource changed elsewhere and needs reconciliation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid parameters, JSON shape, Unicode, or future date
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Cross-origin browser request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error; internal details are suppressed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Storage temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Sign-in provider could not be reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
