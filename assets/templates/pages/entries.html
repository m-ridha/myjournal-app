{{define "entries"}}
<section class="mj-page-card">
  <header class="mj-page-header">
    <div>
      <p class="mj-kicker">{{t "entries.kicker"}}</p>
      <h1>{{t "entries.title"}}</h1>
    </div>
  </header>

  <div class="mj-entry-list" data-entry-list></div>
  <nav class="mj-actions" aria-label="{{t "entries.pagination"}}">
    <a class="mj-btn mj-btn-secondary" data-entries-newer hidden>{{t "entries.newer"}}</a>
    <a class="mj-btn mj-btn-secondary" data-entries-older hidden>{{t "entries.older"}}</a>
    <button class="mj-btn mj-btn-secondary" type="button" data-entries-retry hidden>{{t "entries.retry"}}</button>
  </nav>
  <p role="status" aria-live="polite" data-entries-status>{{t "entries.loading"}}</p>
</section>
{{end}}
