{{define "editor"}}
<section class="mj-editor-shell" data-entry-editor data-entry-date="{{.Date}}">
  <header class="mj-editor-header">
    <button class="mj-icon-btn" type="button" aria-label="{{t "editor.previousDay"}}" data-entry-prev>←</button>
    <div class="mj-editor-title-wrap">
      <p class="mj-kicker">{{if .IsToday}}{{t "editor.today"}}{{else}}{{t "editor.entry"}}{{end}}</p>
      <h1>{{.Title}}</h1>
    </div>
    <button class="mj-icon-btn" type="button" aria-label="{{t "editor.nextDay"}}" data-entry-next>→</button>
  </header>

  <div class="mj-status-row" role="status" aria-live="polite">
    <span class="mj-status-pill" data-entry-status>{{t "editor.loading"}}</span>
    <button class="mj-btn mj-btn-secondary mj-btn-small" type="button" data-entry-save disabled>{{t "editor.save"}}</button>
  </div>

  <div class="mj-editor-recovery">
    <button class="mj-btn mj-btn-secondary mj-btn-small" type="button" data-entry-load-retry hidden>{{t "editor.retryLoad"}}</button>
    <button class="mj-btn mj-btn-secondary mj-btn-small" type="button" data-entry-legacy-draft hidden>{{t "editor.reviewLegacyDraft"}}</button>
  </div>
  <section class="mj-conflict-panel" data-entry-conflict hidden aria-labelledby="entry-conflict-title">
    <h2 id="entry-conflict-title">{{t "editor.conflictTitle"}}</h2>
    <p>{{t "editor.conflictHelp"}}</p>
    <div class="mj-conflict-actions">
      <button class="mj-btn mj-btn-secondary" type="button" data-conflict-mine>{{t "editor.keepMine"}}</button>
      <button class="mj-btn mj-btn-secondary" type="button" data-conflict-other>{{t "editor.loadOther"}}</button>
      <button class="mj-btn mj-btn-secondary" type="button" data-conflict-both>{{t "editor.keepBoth"}}</button>
    </div>
  </section>
  <div class="mj-editor-field">
    <textarea class="mj-editor" aria-label="{{t "editor.label"}}" rows="14" readonly aria-busy="true" data-entry-text></textarea>
    <div class="mj-editor-actions">
      <button class="mj-editor-trash" type="button" aria-label="{{t "editor.delete"}}" title="{{t "editor.delete"}}" data-entry-delete hidden disabled>
        <span class="icon icon-trash" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</section>
{{end}}
