{{define "settings"}}
<section class="mj-page-card">
  <header class="mj-page-header">
    <div>
      <p class="mj-kicker">{{t "settings.kicker"}}</p>
      <h1>{{t "settings.title"}}</h1>
    </div>
  </header>

  <div class="mj-settings-list">
    <div class="mj-setting-row">
      <span>{{t "settings.account"}}</span>
      <strong>{{.AccountName}}</strong>
    </div>
    <div class="mj-setting-row">
      <span>{{t "settings.journalFolder"}}</span>
      <strong>{{.FolderName}}</strong>
    </div>

  </div>

  <div class="mj-settings-actions">
    <button class="mj-btn mj-btn-secondary" type="button" data-sign-out>{{t "settings.signOut"}}</button>
    <button class="mj-btn mj-btn-secondary mj-danger" type="button">{{t "settings.disconnect"}}</button>
    <p role="status" aria-live="polite" data-sign-out-status></p>
  </div>
</section>
{{end}}
