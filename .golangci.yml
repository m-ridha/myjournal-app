version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github/mridha/myjournal-app)
      custom-order: true
  exclusions:
    generated: strict

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - depguard
    - revive
    - testifylint
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: if-return
    depguard:
      rules:
        core:
          files:
            - "!**/*_test.go"
            - "**/internal/core/**.go"
          list-mode: strict
          allow:
            - $gostd
            - cloud.google.com/go/civil
            - github/mridha/myjournal-app/internal/core
            - github/mridha/myjournal-app/internal/testutil
          deny:
            - pkg: net/http
              desc: "Core policy must not depend on HTTP"
            - pkg: html/template
              desc: "Core policy must not depend on rendering"
            - pkg: os
              desc: "Core policy must not access the filesystem"
            - pkg: database/sql
              desc: "Core policy must not access databases"
            - pkg: github/mridha/myjournal-app/internal/driver
              desc: "Core must not import driving adapters"
            - pkg: github/mridha/myjournal-app/internal/driven
              desc: "Core must not import driven adapters"
            - pkg: github/mridha/myjournal-app/internal/config
              desc: "Core must not import startup configuration"
        core-tests:
          files:
            - "**/internal/core/**/*_test.go"
          list-mode: strict
          allow:
            - $gostd
            - cloud.google.com/go/civil
            - github.com/stretchr/testify
            - github/mridha/myjournal-app/internal/core
            - github/mridha/myjournal-app/internal/testutil
          deny:
            - pkg: net/http
              desc: "Core policy must not depend on HTTP"
            - pkg: html/template
              desc: "Core policy must not depend on rendering"
            - pkg: os
              desc: "Core policy must not access the filesystem"
            - pkg: database/sql
              desc: "Core policy must not access databases"
            - pkg: github/mridha/myjournal-app/internal/driver
              desc: "Core must not import driving adapters"
            - pkg: github/mridha/myjournal-app/internal/driven
              desc: "Core must not import driven adapters"
            - pkg: github/mridha/myjournal-app/internal/config
              desc: "Core must not import startup configuration"
        journal-isolation:
          files:
            - "**/internal/core/journal/**.go"
          deny:
            - pkg: github/mridha/myjournal-app/internal/core/connection
              desc: "Journal policy is independent of connection workflows"
        driving-side:
          files:
            - "!**/*_test.go"
            - "**/internal/driver/**.go"
          list-mode: strict
          allow:
            - $gostd
            - cloud.google.com/go/civil
            - github.com/go-chi/chi/v5
            - github.com/oapi-codegen/runtime
            - github/mridha/myjournal-app/assets
            - github/mridha/myjournal-app/internal/core
            - github/mridha/myjournal-app/internal/driver
        driven-side:
          files:
            - "!**/*_test.go"
            - "**/internal/driven/**.go"
          deny:
            - pkg: github/mridha/myjournal-app/internal/driver
              desc: "Driven adapters must not import driving adapters"
            - pkg: github/mridha/myjournal-app/internal/config
              desc: "Driven adapters receive explicit configuration"
        cache-policy:
          files:
            - "!**/*_test.go"
            - "**/internal/driven/cache/journal/**.go"
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sync/singleflight
            - golang.org/x/sync/errgroup
            - cloud.google.com/go/civil
            - github/mridha/myjournal-app/internal/core/journal
            - github/mridha/myjournal-app/internal/driven/cache/journal
        session-codec:
          files:
            - "!**/*_test.go"
            - "**/internal/driven/session/**.go"
          list-mode: strict
          allow:
            - $gostd
            - github/mridha/myjournal-app/internal/core/connection
        providers:
          files:
            - "!**/*_test.go"
            - "**/internal/driven/provider/**.go"
          deny:
            - pkg: github/mridha/myjournal-app/internal/driven/cache
              desc: "Only the composition root wires journal caches"
            - pkg: github/mridha/myjournal-app/internal/driven/session
              desc: "Providers consume connection models, not cookie codecs"
            - pkg: github/mridha/myjournal-app/internal/driven/clock
              desc: "Only the composition root selects clocks"
        cache-storage:
          files:
            - "!**/*_test.go"
            - "**/internal/driven/cache/local/**.go"
          deny:
            - pkg: github/mridha/myjournal-app/internal/core/connection
              desc: "Byte-cache storage must not depend on connection policy"
            - pkg: github/mridha/myjournal-app/internal/driven/provider
              desc: "Byte-cache storage must not construct journal providers"
            - pkg: github/mridha/myjournal-app/internal/driven/session
              desc: "Byte-cache storage must not depend on cookie codecs"
            - pkg: github/mridha/myjournal-app/internal/driven/clock
              desc: "Byte-cache storage must not select the system clock"
        core-production:
          files:
            - "!**/*_test.go"
            - "**/internal/core/**.go"
          deny:
            - pkg: github/mridha/myjournal-app/internal/testutil
              desc: "Production core must not depend on shared test fixtures"
        startup-config:
          files:
            - "!**/*_test.go"
            - "**/internal/config/**.go"
          list-mode: strict
          allow:
            - $gostd
            - github/mridha/myjournal-app/internal/core/connection
